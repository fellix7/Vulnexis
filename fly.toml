# Fly.io: one always-on machine in Mumbai (bom). Deploy with `fly launch --copy-config --no-deploy`, then `fly deploy`.
# Change `app` to the name Fly gives you (it must be unique across Fly).
app = "vulnera"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  # Fly's proxy is the one hop in front of the app; it sets X-Forwarded-For.
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: a sleeping machine makes the first visitor of a demo wait.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
